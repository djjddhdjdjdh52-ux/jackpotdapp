<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump BNB 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 14px; color: #94a3b8; }
        .output { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px; word-break: break-all; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ ChainPump BNB 🔥</h2>
    <button class="btn" onclick="connectWallet()">Connect Wallet</button>
    <p id="walletAddress" style="font-size: 12px; color: #38bdf8; text-align: center; margin-top: 8px;"></p>

    <hr style="border-color: #334155; margin: 20px 0;">

    <h3>Launch Token & Initial Buy</h3>
    <label>Token Name:</label>
    <input type="text" id="tokenName" value="ChainPump Gem">
    
    <label>Token Symbol:</label>
    <input type="text" id="tokenSymbol" value="CPUMP">
    
    <label>Token URI:</label>
    <input type="text" id="tokenUri" value="https://bafybeigdyrzt5fptudm7hu...">

    <label>Initial Launch Amount (BNB): [Min: 0.01]</label>
    <input type="text" id="buyAmount" value="0.01">

    <button class="btn" onclick="createToken()" style="background: #16a34a;">Launch Token Now 🪙</button>

    <div class="output" id="outputStatus">Status: Waiting for wallet connection...</div>
</div>

<script>
    const contractAddress = "0xb2C90c312201d312687D3063f60deB1216173DBc";
    const contractABI = [
        "function createToken(string memory name, string memory symbol, string memory tokenURI) public payable returns (address)",
        "function getTokensCount() public view returns (uint256)"
    ];

    let signer;
    let factoryContract;

    async function connectWallet() {
        if (window.ethereum) {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                
                const network = await provider.getNetwork();
                if (network.chainId !== 56) {
                    alert("Please switch to BNB Smart Chain Mainnet in your wallet!");
                    return;
                }

                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("walletAddress").innerText = "Connected: " + address;
                
                factoryContract = new ethers.Contract(contractAddress, contractABI, signer);
                document.getElementById("outputStatus").innerText = "Wallet connected successfully. Ready to launch!";
            } catch (error) {
                console.error(error);
                alert("Failed to connect wallet!");
            }
        } else {
            alert("Please open this page from a Web3 browser like MetaMask or Mises Browser!");
        }
    }

    async function createToken() {
        if (!factoryContract) {
            alert("Please connect your wallet first!");
            return;
        }

        const name = document.getElementById("tokenName").value;
        const symbol = document.getElementById("tokenSymbol").value;
        const uri = document.getElementById("tokenUri").value;
        const bnbAmount = document.getElementById("buyAmount").value;

        // التحقق من أن المبلغ المدخل لا يقل عن 0.01 BNB
        if (parseFloat(bnbAmount) < 0.01) {
            alert("Minimum launch amount is 0.01 BNB!");
            return;
        }

        try {
            document.getElementById("outputStatus").innerText = "Sending transaction to launch token...";
            
            const tx = await factoryContract.createToken(name, symbol, uri, {
                value: ethers.utils.parseEther(bnbAmount)
            });
            
            document.getElementById("outputStatus").innerText = "Transaction sent, waiting for confirmation... Tx: " + tx.hash;
            
            await tx.wait();
            document.getElementById("outputStatus").innerText = "🎉 Token launched and bought successfully!";
            alert("Congratulations! Token launched successfully.");
        } catch (error) {
            console.error(error);
            document.getElementById("outputStatus").innerText = "Execution error: " + (error.message || error);
            alert("An error occurred during token launch. Check your gas balance.");
        }
    }
</script>

</body>
</html>
