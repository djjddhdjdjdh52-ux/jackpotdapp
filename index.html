تط<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إطلاق العملات - Viral Meme Factory</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; }
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 14px; color: #94a3b8; }
        .output { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px; word-break: break-all; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 مصنع العملات الفيروسية</h2>
    <button class="btn" onclick="connectWallet()">ربط المحفظة (Connect Wallet)</button>
    <p id="walletAddress" style="font-size: 12px; color: #38bdf8; text-align: center; margin-top: 8px;"></p>

    <hr style="border-color: #334155; margin: 20px 0;">

    <h3>إطلاق عملة جديدة أو الشراء التجريبي</h3>
    <label>اسم العملة (Name):</label>
    <input type="text" id="tokenName" value="Smart Money Illusion">
    
    <label>رمز العملة (Symbol):</label>
    <input type="text" id="tokenSymbol" value="SMG">
    
    <label>رابط البيانات (Token URI):</label>
    <input type="text" id="tokenUri" value="https://bafybeigdyrzt5fptudm7hu...">

    <label>مبلغ الشراء التجريبي (BNB):</label>
    <input type="text" id="buyAmount" value="0.001">

    <button class="btn" onclick="createToken()" style="background: #16a34a;">إطلاق العملة وتأكيد الشراء 🪙</button>

    <div class="output" id="outputStatus">الحالة: بانتظار ربط المحفظة...</div>
</div>

<script>
    const contractAddress = "0xb2C90c312201d312687D3063f60deB1216173DBc";
    const contractABI = [
        "function createToken(string memory name, string memory symbol, string memory tokenURI) public payable returns (address)",
        "function getTokensCount() public view returns (uint256)"
    ];

    let signer;
    let factoryContract;

    async function connectWallet() {
        if (window.ethereum) {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                
                const network = await provider.getNetwork();
                if (network.chainId !== 56) {
                    alert("الرجاء التحويل إلى شبكة BNB Smart Chain الرئيسية في محفظتك!");
                    return;
                }

                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("walletAddress").innerText = "متصل: " + address;
                
                factoryContract = new ethers.Contract(contractAddress, contractABI, signer);
                document.getElementById("outputStatus").innerText = "تم ربط المحفظة بنجاح وجاهز للإطلاق!";
            } catch (error) {
                console.error(error);
                alert("فشل ربط المحفظة!");
            }
        } else {
            alert("الرجاء فتح الصفحة من متصفح يدعم المحافظ مثل MetaMask أو Mises Browser!");
        }
    }

    async function createToken() {
        if (!factoryContract) {
            alert("الرجاء ربط المحفظة أولاً!");
            return;
        }

        const name = document.getElementById("tokenName").value;
        const symbol = document.getElementById("tokenSymbol").value;
        const uri = document.getElementById("tokenUri").value;
        const bnbAmount = document.getElementById("buyAmount").value;

        try {
            document.getElementById("outputStatus").innerText = "جاري إرسال المعاملة لإطلاق العملة...";
            
            // تحويل قيمة الـ BNB إلى Wei وإرسالها مع المعاملة كقيمة (value)
            const tx = await factoryContract.createToken(name, symbol, uri, {
                value: ethers.utils.parseEther(bnbAmount)
            });
            
            document.getElementById("outputStatus").innerText = "تم الإرسال، بانتظار التأكيد على الشبكة... Tx: " + tx.hash;
            
            await tx.wait();
            document.getElementById("outputStatus").innerText = "🎉 تمت عملية الإطلاق والشراء بنجاح تام!";
            alert("مبروك! تم إطلاق العملة بنجاح.");
        } catch (error) {
            console.error(error);
            document.getElementById("outputStatus").innerText = "خطأ أثناء التنفيذ: " + (error.message || error);
            alert("حدث خطأ أثناء إطلاق العملة، تأكد من رصيد الغاز.");
        }
    }
</script>

</body>
</html>
