<!-- Mode Selector: Doodle vs AI vs Upload -->
<label><i class="fa-solid fa-image"></i> Token Logo Source</label>
<div class="art-mode-selector">
    <button class="mode-btn active" id="btnModeDoodle" onclick="switchArtMode('doodle')">🎨 Doodle</button>
    <button class="mode-btn" id="btnModeAI" onclick="switchArtMode('ai')">🪄 AI Art</button>
    <button class="mode-btn" id="btnModeUpload" onclick="switchArtMode('upload')">📁 Upload</button>
</div>
