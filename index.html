<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainPump BNB 🚀 | The Ultimate Jackpot</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        
        /* --- تنسيقات الجائزة الكبرى (Jackpot) --- */
        .jackpot-box { background: linear-gradient(135deg, #b45309, #ea580c); padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; border: 2px solid #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); animation: pulse-glow 2s infinite; }
        .jackpot-title { font-size: 14px; font-weight: bold; color: #fef3c7; text-transform: uppercase; }
        .jackpot-amount { font-size: 32px; font-weight: bold; color: #fff; margin: 5px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .countdown { font-size: 18px; color: #fde047; font-weight: bold; font-family: monospace; }
        .last-buyer { font-size: 12px; color: #ffedd5; margin-top: 5px; }
        
        @keyframes pulse-glow { 0% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); } 50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.8); } 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); } }

        /* --- باقي التنسيقات --- */
        .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #0369a1; transform: scale(1.02); }
        .btn-launch { background: #16a34a; font-size: 18px; text-transform: uppercase; }
        .btn-launch:hover { background: #15803d; }
        
        .input-group { position: relative; margin: 8px 0 15px 0; }
        input[type="text"] { width: 100%; padding: 10px 45px 10px 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        label { font-size: 14px; color: #94a3b8; font-weight: bold; }
        
        .mic-btn { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 5px; border-radius: 50%; }
        .mic-btn:hover { background: #334155; }
        .mic-active { color: #ef4444; }

        .output { background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 13px; word-break: break-all; border: 1px solid #334155; color: #fbbf24; text-align: center; }
        
        .tab-container { display: flex; gap: 10px; margin-top: 15px; }
        .tab { flex: 1; text-align: center; padding: 8px; background: #334155; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: bold; }
        .tab.active { background: #0f172a; color: #38bdf8; border: 1px solid #38bdf8; border-bottom: none; }
        .tab-content { background: #0f172a; padding: 15px; border: 1px solid #38bdf8; border-radius: 0 0 6px 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ ChainPump BNB 🔥</h2>
    <p id="walletAddress" style="font-size: 12px; color: #38bdf8; text-align: center; margin-top: 0;">Not Connected</p>

    <!-- 🏆 قسم الجائزة الكبرى (Jackpot Section) -->
    <div class="jackpot-box">
        <div class="jackpot-title">🏆 Current Grand Jackpot</div>
        <div class="jackpot-amount" id="jackpotPool">-- BNB</div>
        <div class="countdown">⏳ Timer: <span id="timerDisplay">00:00:00</span></div>
        <div class="last-buyer" id="lastBuyerDisplay">Last Action By: Waiting...</div>
    </div>

    <button class="btn" onclick="connectWallet()">🔗 Connect Wallet</button>

    <hr style="border-color: #334155; margin: 20px 0;">

    <label>Token Name:</label>
    <div class="input-group">
        <input type="text" id="tokenName" placeholder="e.g. Pepe Killer">
        <button class="mic-btn" onclick="startVoiceInput('tokenName', this)">🎤</button>
    </div>
    
    <label>Token Symbol:</label>
    <div class="input-group">
        <input type="text" id="tokenSymbol" placeholder="e.g. PEPEK">
        <button class="mic-btn" onclick="startVoiceInput('tokenSymbol', this)">🎤</button>
    </div>

    <label>🎨 Token Logo (Doodle Style):</label>
    <div class="tab-container">
        <div class="tab active" onclick="switchTab('ai')">🤖 Prompt</div>
        <div class="tab" onclick="switchTab('draw')">🖍️ Draw</div>
    </div>
    
    <div class="tab-content" id="aiTab">
        <div class="input-group" style="margin-bottom: 0;">
            <input type="text" id="aiPrompt" placeholder="Describe to generate doodle...">
            <button class="mic-btn" onclick="startVoiceInput('aiPrompt', this)">🎤</button>
        </div>
    </div>
    
    <div class="tab-content" id="drawTab" style="display: none;">
        <canvas id="sketchpad" width="280" height="150" style="background: white; width: 100%; border-radius: 6px; cursor: crosshair; touch-action: none;"></canvas>
    </div>

    <label style="display: block; margin-top: 15px;">Initial Launch Amount (BNB): [Min: 0.01]</label>
    <div class="input-group">
        <input type="text" id="buyAmount" value="0.01">
    </div>

    <button class="btn btn-launch" onclick="createToken()">🚀 Launch Token Now</button>

    <div class="output" id="outputStatus">Status: Ready to pump!</div>
</div>

<script>
    // --- نظام الجائزة والعداد التنازلي (Jackpot Timer) ---
    // هذه القيم للتجربة (Mockup) حتى نربطها بدوال العقد الذكي الخاصة بك
    let countdownTime = 600; // 10 دقائق بالثواني كمثال
    setInterval(() => {
        if(countdownTime > 0) countdownTime--;
        const hours = Math.floor(countdownTime / 3600).toString().padStart(2, '0');
        const minutes = Math.floor((countdownTime % 3600) / 60).toString().padStart(2, '0');
        const seconds = (countdownTime % 60).toString().padStart(2, '0');
        document.getElementById("timerDisplay").innerText = `${hours}:${minutes}:${seconds}`;
        
        // محاكاة لحجم الجائزة (يمكنك تغييره ليقرأ من العقد مباشرة)
        document.getElementById("jackpotPool").innerText = (Math.random() * (5.5 - 5.0) + 5.0).toFixed(3) + " BNB";
    }, 1000);

    // --- ميزة الإدخال الصوتي ---
    function startVoiceInput(targetId, btnElement) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert("Voice not supported."); return; }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.onstart = () => btnElement.classList.add("mic-active");
        recognition.onspeechend = () => { recognition.stop(); btnElement.classList.remove("mic-active"); };
        recognition.onresult = (event) => document.getElementById(targetId).value = event.results[0][0].transcript;
        recognition.start();
    }

    // --- التبديل بين الرسم والكتابة ---
    function switchTab(tab) {
        document.getElementById('aiTab').style.display = tab === 'ai' ? 'block' : 'none';
        document.getElementById('drawTab').style.display = tab === 'draw' ? 'block' : 'none';
        document.getElementsByClassName('tab')[0].classList.toggle('active', tab === 'ai');
        document.getElementsByClassName('tab')[1].classList.toggle('active', tab === 'draw');
    }

    // --- إعدادات لوحة الرسم ---
    const canvas = document.getElementById("sketchpad");
    const ctx = canvas.getContext("2d");
    let painting = false;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    function startPosition(e) { painting = true; draw(e); }
    function endPosition() { painting = false; ctx.beginPath(); }
    function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "black";
        ctx.lineTo(clientX - rect.left, clientY - rect.top); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(clientX - rect.left, clientY - rect.top);
    }
    canvas.addEventListener("mousedown", startPosition); canvas.addEventListener("mouseup", endPosition);
    canvas.addEventListener("mousemove", draw); canvas.addEventListener("touchstart", startPosition);
    canvas.addEventListener("touchend", endPosition); canvas.addEventListener("touchmove", draw);

    // --- إعدادات العقد الذكي للإنشاء ---
    const contractAddress = "0xb2C90c312201d312687D3063f60deB1216173DBc";
    const contractABI = ["function createToken(string memory name, string memory symbol, string memory tokenURI) public payable returns (address)"];
    let signer; let factoryContract;

    async function connectWallet() {
        if (window.ethereum) {
            try {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                const address = await signer.getAddress();
                document.getElementById("walletAddress").innerText = "Connected: " + address.substring(0,6) + "..." + address.substring(38);
                factoryContract = new ethers.Contract(contractAddress, contractABI, signer);
                document.getElementById("outputStatus").innerText = "Wallet Connected! Ready.";
                document.getElementById("lastBuyerDisplay").innerText = "Last Action By: " + address.substring(0,6) + "...";
            } catch (error) { alert("Failed to connect wallet!"); }
        } else { alert("Please use a Web3 browser like Mises!"); }
    }

    async function createToken() {
        if (!factoryContract) { alert("Connect wallet first!"); return; }
        const name = document.getElementById("tokenName").value;
        const symbol = document.getElementById("tokenSymbol").value;
        const bnbAmount = document.getElementById("buyAmount").value;

        if (parseFloat(bnbAmount) < 0.01) { alert("Min amount is 0.01 BNB!"); return; }

        document.getElementById("outputStatus").innerText = "🔥 Processing... Do not close!";
        
        try {
            const tx = await factoryContract.createToken(name, symbol, "URI_PENDING", { value: ethers.utils.parseEther(bnbAmount) });
            document.getElementById("outputStatus").innerText = "Waiting for block confirmation...";
            await tx.wait();
            
            // إعادة ضبط وقت الجائزة الكبرى بعد الإطلاق!
            countdownTime = 600; 
            document.getElementById("outputStatus").innerHTML = "🎉 <b style='color: #4ade80;'>TOKEN LAUNCHED! YOU RESET THE TIMER!</b> 🚀";
        } catch (error) {
            document.getElementById("outputStatus").innerText = "Error: " + (error.message || error);
        }
    }
</script>

</body>
</html>
